<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapter — The Besorah</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%226%22%20fill%3D%22%231a1410%22%2F%3E%3Cpath%20d%3D%22M8%207h16v18H8z%22%20fill%3D%22none%22%20stroke%3D%22%23d4af37%22%20stroke-width%3D%222%22%2F%3E%3Cpath%20d%3D%22M16%207v18M11%2012h3M18%2012h3M11%2017h3M18%2017h3%22%20stroke%3D%22%23d4af37%22%20stroke-width%3D%221.5%22%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- The reader is meant to work with no network at all, so the web font
     is loaded without blocking the page: the local Cardo/Garamond/Palatino
     fallback shows immediately and the web font swaps in if it arrives. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&display=swap"></noscript>
<link rel="stylesheet" href="assets/style.css">
<script src="assets/besorah-ids.js"></script>
<script src="assets/words.js"></script>
<script src="assets/pronunciation.js"></script>
<script src="assets/besorah-marks.js"></script>
<script src="assets/besorah-tts.js"></script>
<style>
  /* Pin the footer to the bottom of the viewport on short chapters */
  body { display: flex; flex-direction: column; min-height: 100vh; margin: 0; }
  .chapter-bar { flex: 0 0 auto; }
  .chapter-main { flex: 1 1 auto; }
  .chapter-footer { flex: 0 0 auto; }
</style>
</head>
<body>

<div class="chapter-bar">
  <div class="title">
    <a href="index.html" title="Home" style="margin-right:0.4rem;">⌂</a>
    <a href="books.html" title="All books" style="margin-right:0.6rem;">&larr;</a>
    <span class="heb" id="bar-heb">…</span>
    <span class="eng" id="bar-eng"></span>
    <span id="bar-ch" style="margin-left:0.6rem; color: var(--ink-dim);"></span>
  </div>
  <div class="controls">
    <a id="prev" href="#">&larr; Prev</a>
    <a id="book-toc" href="#">Chapters</a>
    <a id="pdf-link" href="#" target="_blank" title="Open original PDF page">PDF</a>
    <button id="bookmark-btn" class="btn" type="button" title="Bookmark this chapter" aria-pressed="false">☆</button>
    <a id="next" href="#">Next &rarr;</a>
  </div>
  <div class="tts-bar" id="tts-bar"></div>
</div>

<main class="chapter-main">
  <div class="chapter-page" id="chapter-page">
    <h1 class="chapter-page-title" id="page-heb"></h1>
    <h2 class="chapter-page-sub" id="page-eng"></h2>
    <div class="chapter-num" id="ch-num"></div>
    <div id="verses" class="verses"></div>
    <p class="note" id="loading">Loading chapter…</p>
    <p class="note mark-hint">Touch any verse to mark it or start the reader
      there. Select words first to mark just those — everything you mark is
      gathered on the <a href="index.html">home page</a>.</p>
  </div>
</main>

<footer class="chapter-footer">
  <div class="controls">
    <a id="prev2" href="#">&larr; Previous chapter</a>
    <a id="next2" href="#">Next chapter &rarr;</a>
  </div>
</footer>

<script>
const params  = new URLSearchParams(location.search);
// An id from a link may be one a book carried before its name was
// corrected; BesorahIds brings it forward (assets/besorah-ids.js).
const bookId  = window.BesorahIds
  ? BesorahIds.resolve(params.get('id'))
  : params.get('id');
const chapter = parseInt(params.get('ch'), 10) || 1;
const verseAnchor = parseInt(params.get('v'), 10) || null;
const markAnchor = params.get('m');   // a marked passage arrived at from home

fetch('assets/index.json')
  .then(r => r.json())
  .then(idx => {
    const book = idx.books.find(b => b.id === bookId);
    if (!book) throw new Error('Book not found');
    return fetch(`assets/text/${book.id}.json`)
      .then(r => r.json())
      .then(text => ({book, text}));
  })
  .then(({book, text}) => {
    const ch = text.chapters[String(chapter)];
    if (!ch) throw new Error('Chapter not found');

    // Header / title
    document.title = `${book.hebrew}${book.chapter_count > 1 ? ' ' + chapter : ''} — The Besorah`;
    document.getElementById('bar-heb').textContent = book.hebrew;
    document.getElementById('bar-eng').textContent = `(${book.english})`;
    if (book.chapter_count > 1) {
      document.getElementById('bar-ch').textContent = `Chapter ${chapter}`;
    }
    document.getElementById('page-heb').textContent = book.hebrew;
    document.getElementById('page-eng').textContent = book.english;
    if (book.chapter_count > 1) {
      document.getElementById('ch-num').textContent = chapter;
    }

    // PDF link (still available for cross-reference)
    document.getElementById('pdf-link').href = `SCRIPTURE/${ch.pdf}#page=${ch.page}`;

    // Prev / Next links
    function setLink(elId, href, disabled) {
      const el = document.getElementById(elId);
      if (!el) return;
      if (disabled) {
        el.classList.add('disabled');
        el.removeAttribute('href');
      } else {
        el.classList.remove('disabled');
        el.href = href;
      }
    }
    const prevHref = chapter > 1 ? `chapter.html?id=${book.id}&ch=${chapter - 1}` : '#';
    const nextHref = chapter < book.chapter_count ? `chapter.html?id=${book.id}&ch=${chapter + 1}` : '#';
    setLink('prev',  prevHref, chapter <= 1);
    setLink('prev2', prevHref, chapter <= 1);
    setLink('next',  nextHref, chapter >= book.chapter_count);
    setLink('next2', nextHref, chapter >= book.chapter_count);
    document.getElementById('book-toc').href = `book.html?id=${book.id}`;

    // Bookmark + last-read tracking (localStorage; nothing leaves the device)
    BesorahMarks.recordLastRead(book, chapter);
    BesorahMarks.wireBookmarkButton(
      document.getElementById('bookmark-btn'), book, chapter
    );
    // Read-aloud player (built once; re-pointed at this chapter's verses).
    BesorahTTS.init(document.getElementById('tts-bar'));

    // Wire after verses are rendered (below — defer to next tick).
    queueMicrotask(() => {
      const versesEl = document.getElementById('verses');
      BesorahMarks.wireVerseClicks(versesEl, book, chapter);
      // Marked text: paint saved highlights and let a fresh selection be
      // marked. Wired before the read-aloud player so tapping a highlight
      // offers to remove it instead of starting playback.
      BesorahMarks.wireTextMarks(versesEl, book, chapter, {
        onRead: el => BesorahTTS.readFrom(el)
      });
      BesorahTTS.bind(versesEl);
      if (markAnchor) BesorahMarks.scrollToTextMark(markAnchor);
      else BesorahMarks.scrollToVerse(verseAnchor);
    });

    // Render verses
    const out = document.getElementById('verses');
    out.innerHTML = '';
    const verses = ch.verses || [];
    if (verses.length === 0) {
      out.innerHTML = `<p class="note">No text extracted for this chapter. <a href="SCRIPTURE/${ch.pdf}#page=${ch.page}" target="_blank">Open the PDF page</a>.</p>`;
    } else {
      // Verse text may contain <span class="dn">…</span> for divine names
      // and <span class="hwhy">HWHY</span> for the paleo-Hebrew
      // tetragrammaton. Escape every other angle bracket and only
      // un-escape these two whitelisted elements.
      function renderVerseText(raw) {
        // Word forms are corrected on the way to the screen (assets/words.js)
        // so a re-extracted book still reads correctly.
        const fixed = window.BesorahWords ? BesorahWords.repair(raw) : raw;
        const esc = fixed
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
        // Un-escape only the whitelisted tags, opening and closing handled
        // separately so a footnote containing a divine name still renders.
        return esc
          .replace(/&lt;span class="(dn|hwhy|fn)"&gt;/g, '<span class="$1">')
          .replace(/&lt;\/span&gt;/g, '</span>');
      }

      // Long-form chapters (Patriarchs, single-verse books) get single-block prose
      const isProse = verses.length === 1 && verses[0].t.length > 600;
      if (isProse) {
        const para = document.createElement('p');
        para.className = 'prose';
        para.innerHTML = renderVerseText(verses[0].t);
        out.appendChild(para);
      } else {
        for (const v of verses) {
          const p = document.createElement('p');
          p.className = 'verse';
          p.id = `v-${v.n}`;
          p.dataset.v = v.n;
          p.innerHTML =
            `<sup class="verse-n">${v.n}</sup> ` + renderVerseText(v.t);
          out.appendChild(p);
        }
      }
    }
    document.getElementById('loading').style.display = 'none';
  })
  .catch(err => {
    console.error(err);
    // Say what actually went wrong: a link to a book or chapter that does
    // not exist is a different failure from opening the site off file://.
    const known = /^(Book|Chapter) not found$/.test(err.message);
    document.getElementById('loading').textContent = known
      ? err.message + '. Check the link, or pick the book again from the Books page.'
      : 'Failed to load chapter. Make sure you opened this site through a local web server (e.g. `python3 -m http.server`).';
  });
</script>
</body>
</html>
