<!DOCTYPE html>
<html lang="en">
<head>

<meta name="theme-color" content="#1a1410">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Search — The Besorah</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%226%22%20fill%3D%22%231a1410%22%2F%3E%3Cpath%20d%3D%22M8%207h16v18H8z%22%20fill%3D%22none%22%20stroke%3D%22%23d4af37%22%20stroke-width%3D%222%22%2F%3E%3Cpath%20d%3D%22M16%207v18M11%2012h3M18%2012h3M11%2017h3M18%2017h3%22%20stroke%3D%22%23d4af37%22%20stroke-width%3D%221.5%22%2F%3E%3C%2Fsvg%3E">
<link rel="stylesheet" href="assets/style.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<!-- Theme, text size and reading mode are applied before first paint, so a
     reader who chose Light never sees a flash of Dark (assets/besorah-ui.js). -->
<script>(function(){try{var p=JSON.parse(localStorage.getItem("besorah-prefs")||"{}"),d=document.documentElement;d.setAttribute("data-theme",p.theme||"auto");if(p.size)d.style.setProperty("--fs",p.size);if(p.compact)d.classList.add("compact-reading")}catch(e){}})();</script>

<script src="assets/words.js"></script>
<script src="assets/pronunciation.js"></script>
<script src="assets/besorah-ui.js"></script>
<script src="assets/besorah-search.js"></script>
</head>
<body>
<header class="site-header">
  <h1>THE BESORAH</h1>
  <div class="sub">Search the Scriptures</div>
  <nav><a href="index.html">&larr; Home</a><a href="books.html">All 104 Books</a></nav>
</header>

<main class="search-main">
  <div id="search-box"></div>
</main>

<script>
// Wrapped in an IIFE because assets/besorah-nav.js re-runs this script on
// every soft (in-document) visit to this page.
(function () {
"use strict";
const books = {};
const box = document.getElementById('search-box');
const search = BesorahSearch.mount(box, {
  query: new URLSearchParams(location.search).get('q') || '',
  getIndex: () => fetch('assets/index.json').then(r => r.json()),
  getBook: id => books[id] || (books[id] = fetch(`assets/text/${id}.json`).then(r => r.json())),
  chapterUrl: (id, ch, v) => `chapter.html?id=${encodeURIComponent(id)}&ch=${ch}` + (v ? `&v=${v}` : ''),
  // Keep the query in the address, so Back returns to these results.
  onQuery: q => {
    history.replaceState(history.state, '', q ? `search.html?q=${encodeURIComponent(q)}` : 'search.html');
    if (window.BesorahNav) BesorahNav.note();
  }
});
search.focus();
})();
</script>
<script src="assets/besorah-nav.js" defer></script>
<script src="assets/besorah-fullscreen.js" defer></script>
</body>
</html>
