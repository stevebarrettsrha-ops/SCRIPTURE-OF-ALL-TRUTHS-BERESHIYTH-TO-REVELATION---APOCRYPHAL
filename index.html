<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1410">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>The Besorah — Daily Bread &amp; Reading Room</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%226%22%20fill%3D%22%231a1410%22%2F%3E%3Cpath%20d%3D%22M8%207h16v18H8z%22%20fill%3D%22none%22%20stroke%3D%22%23d4af37%22%20stroke-width%3D%222%22%2F%3E%3Cpath%20d%3D%22M16%207v18M11%2012h3M18%2012h3M11%2017h3M18%2017h3%22%20stroke%3D%22%23d4af37%22%20stroke-width%3D%221.5%22%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- The reader is meant to work with no network at all, so the web font
     is loaded without blocking the page: the local Cardo/Garamond/Palatino
     fallback shows immediately and the web font swaps in if it arrives. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&family=EB+Garamond:ital,wght@0,500;1,400&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&family=EB+Garamond:ital,wght@0,500;1,400&display=swap"></noscript>
<link rel="stylesheet" href="assets/style.css">
<script src="assets/besorah-ids.js"></script>
<script src="assets/words.js"></script>
<script src="assets/pronunciation.js"></script>
<script src="assets/besorah-marks.js"></script>
<script src="assets/besorah-tts.js"></script>
<script src="assets/DailyBread.js"></script>
<script src="assets/besorah-home.js"></script>
</head>
<body>
<header class="site-header">
  <h1>THE BESORAH</h1>
  <div class="sub">Bereshith &mdash; to &mdash; Ḥazon &mdash; with the Apocrypha</div>
  <nav>
    <a href="books.html">All 104 Books</a>
    <a href="#tehillim-card">Tehillim</a>
    <a href="#mishle-card">Mishle</a>
    <a href="#marked-card">Marked text</a>
  </nav>
</header>

<main class="home">
  <p class="note" id="home-error" hidden></p>

  <section class="card daily-card" id="daily-card"></section>

  <div class="home-row">
    <section class="card" id="continue-card"></section>
    <section class="card" id="reader-card"></section>
  </div>

  <div class="home-row">
    <section class="card quick-card" id="tehillim-card"></section>
    <section class="card quick-card" id="mishle-card"></section>
  </div>

  <section class="card" id="marked-card"></section>
  <section class="card" id="bookmarks-card"></section>
</main>

<script>
function chapterUrl(bookId, ch, verse, markId) {
  let url = `chapter.html?id=${encodeURIComponent(bookId)}&ch=${ch}`;
  if (verse != null) url += `&v=${verse}`;
  if (markId) url += `&m=${encodeURIComponent(markId)}`;
  return url;
}
function bookUrl(bookId) {
  return `book.html?id=${encodeURIComponent(bookId)}`;
}

Promise.all([
  fetch('assets/index.json').then(r => r.json()),
  fetch('assets/daily-bread.json').then(r => r.json())
]).then(([index, daily]) => {
  BesorahHome.render({
    index: index,
    pool: daily.pool,
    loadBook: id => fetch(`assets/text/${id}.json`).then(r => r.json()),
    chapterUrl: chapterUrl,
    bookUrl: bookUrl
  });
}).catch(err => {
  const box = document.getElementById('home-error');
  box.hidden = false;
  box.innerHTML =
    'Failed to load the canon. Open this site via a local web server (not file://) — ' +
    'e.g. <code>python3 -m http.server</code> — or use the ' +
    '<a href="besorah-offline.html">single-file offline edition</a>.';
  console.error(err);
});
</script>
<script src="assets/besorah-fullscreen.js" defer></script>
</body>
</html>
