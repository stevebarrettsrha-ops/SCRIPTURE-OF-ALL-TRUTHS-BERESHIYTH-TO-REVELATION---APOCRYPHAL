<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1410">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Book — The Besorah</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%226%22%20fill%3D%22%231a1410%22%2F%3E%3Cpath%20d%3D%22M8%207h16v18H8z%22%20fill%3D%22none%22%20stroke%3D%22%23d4af37%22%20stroke-width%3D%222%22%2F%3E%3Cpath%20d%3D%22M16%207v18M11%2012h3M18%2012h3M11%2017h3M18%2017h3%22%20stroke%3D%22%23d4af37%22%20stroke-width%3D%221.5%22%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- The reader is meant to work with no network at all, so the web font
     is loaded without blocking the page: the local Cardo/Garamond/Palatino
     fallback shows immediately and the web font swaps in if it arrives. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&display=swap"></noscript>
<link rel="stylesheet" href="assets/style.css">
<script src="assets/besorah-ids.js"></script>
</head>
<body>
<header class="site-header">
  <h1 id="page-title">THE BESORAH</h1>
  <div class="sub" id="page-section"></div>
  <nav><a href="index.html">⌂ Home</a><a href="books.html">&larr; All Books</a></nav>
</header>

<main>
  <div class="book-title">
    <div class="heb" id="book-heb"></div>
    <div class="eng" id="book-eng"></div>
  </div>
  <div id="chapter-list"></div>
</main>

<script>
const params = new URLSearchParams(location.search);
// An id from a link may predate a name correction — see besorah-ids.js.
const bookId = window.BesorahIds
  ? BesorahIds.resolve(params.get('id'))
  : params.get('id');

fetch('assets/index.json')
  .then(r => r.json())
  .then(data => {
    const book = data.books.find(b => b.id === bookId);
    if (!book) {
      document.getElementById('chapter-list').innerHTML = '<p class="note">Book not found.</p>';
      return;
    }
    document.title = `${book.hebrew} (${book.english}) — The Besorah`;

    document.getElementById('page-title').textContent = book.hebrew;
    document.getElementById('page-section').textContent = book.section.toUpperCase();
    document.getElementById('book-heb').textContent = book.hebrew;
    document.getElementById('book-eng').textContent = book.english;

    const list = document.getElementById('chapter-list');
    if (book.chapter_count === 1) {
      // Single-chapter books — link directly to the only chapter
      const a = document.createElement('a');
      a.className = 'chapter-link';
      a.href = `chapter.html?id=${encodeURIComponent(book.id)}&ch=1`;
      a.style.maxWidth = '300px';
      a.style.margin = '2rem auto';
      a.style.fontSize = '1.1rem';
      a.style.padding = '1rem';
      a.textContent = `Read ${book.hebrew} →`;
      list.appendChild(a);
    } else {
      const heading = document.createElement('p');
      heading.style.textAlign = 'center';
      heading.style.color = 'var(--ink-dim)';
      heading.style.marginTop = '1rem';
      heading.textContent = `${book.chapter_count} chapters`;
      list.appendChild(heading);

      const grid = document.createElement('div');
      grid.className = 'chapter-grid';
      for (let i = 1; i <= book.chapter_count; i++) {
        const a = document.createElement('a');
        a.className = 'chapter-link';
        a.href = `chapter.html?id=${encodeURIComponent(book.id)}&ch=${i}`;
        a.textContent = i;
        grid.appendChild(a);
      }
      list.appendChild(grid);
    }
  })
  .catch(err => {
    document.getElementById('chapter-list').innerHTML =
      '<p class="note">Failed to load canon index. Open this site via a local web server (not file://).</p>';
    console.error(err);
  });
</script>
<script src="assets/besorah-fullscreen.js" defer></script>
</body>
</html>
