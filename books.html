<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Books — The Besorah</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%226%22%20fill%3D%22%231a1410%22%2F%3E%3Cpath%20d%3D%22M8%207h16v18H8z%22%20fill%3D%22none%22%20stroke%3D%22%23d4af37%22%20stroke-width%3D%222%22%2F%3E%3Cpath%20d%3D%22M16%207v18M11%2012h3M18%2012h3M11%2017h3M18%2017h3%22%20stroke%3D%22%23d4af37%22%20stroke-width%3D%221.5%22%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- The reader is meant to work with no network at all, so the web font
     is loaded without blocking the page: the local Cardo/Garamond/Palatino
     fallback shows immediately and the web font swaps in if it arrives. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&family=EB+Garamond:ital,wght@0,500;1,400&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&family=EB+Garamond:ital,wght@0,500;1,400&display=swap"></noscript>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="site-header">
  <h1>THE BESORAH</h1>
  <div class="sub">Bereshith &mdash; to &mdash; Ḥazon &mdash; with the Apocrypha</div>
  <nav><a href="index.html">&larr; Home</a></nav>
</header>

<main>
  <input type="search" id="search" placeholder="Search for a book (Hebrew or English name)…" autocomplete="off">
  <div id="content">
    <p class="note">Loading the canon…</p>
  </div>
</main>

<script>
const SECTIONS = [
  { key: "Torah",       label: "Torah — Teaching" },
  { key: "Nabi'im",     label: "Nabi'im — Prophets" },
  { key: "Kethubim",    label: "Kethubim — Writings" },
  { key: "Messianic",   label: "Messianic Writings" },
  { key: "Apocryphal",  label: "Apocryphal Books" },
  { key: "Patriarchs",  label: "Testaments of the Twelve Patriarchs" },
  { key: "Apocrypha",   label: "Ethiopic & Eastern Apocrypha" },
];

function renderBooks(data, filter) {
  const root = document.getElementById('content');
  root.innerHTML = '';
  const f = (filter || '').trim().toLowerCase();

  for (const s of SECTIONS) {
    const books = data.books.filter(b =>
      b.section === s.key &&
      (!f || b.hebrew.toLowerCase().includes(f) || b.english.toLowerCase().includes(f))
    );
    if (books.length === 0) continue;

    const section = document.createElement('section');
    section.className = 'section';
    const h2 = document.createElement('h2');
    h2.textContent = s.label;
    section.appendChild(h2);

    const grid = document.createElement('div');
    grid.className = 'book-grid';
    for (const b of books) {
      const a = document.createElement('a');
      a.className = 'book-link';
      a.href = `book.html?id=${encodeURIComponent(b.id)}`;
      a.innerHTML = `<span class="heb">${b.hebrew}</span><span class="eng">${b.english}</span>`;
      grid.appendChild(a);
    }
    section.appendChild(grid);
    root.appendChild(section);
  }

  if (root.children.length === 0) {
    const p = document.createElement('p');
    p.className = 'note';
    p.textContent = 'No books match your search.';
    root.appendChild(p);
  }
}

fetch('assets/index.json')
  .then(r => r.json())
  .then(data => {
    renderBooks(data, '');
    document.getElementById('search').addEventListener('input', e => {
      renderBooks(data, e.target.value);
    });
  })
  .catch(err => {
    document.getElementById('content').innerHTML =
      '<p class="note">Failed to load canon index. Open this site via a local web server (not file://). E.g. <code>python3 -m http.server</code></p>';
    console.error(err);
  });
</script>
</body>
</html>
