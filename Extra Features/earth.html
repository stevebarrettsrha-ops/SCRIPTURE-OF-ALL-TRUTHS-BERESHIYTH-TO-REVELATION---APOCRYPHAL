<title>THE EARTH — Within the Firmament</title>
<style>
  :root{ --gold:#d4af37; --ink:#f4ead5; --bg:#0b0806; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:100%; height:100%; overflow:hidden; background:var(--bg);
    font-family:'Cardo',Georgia,'Times New Roman',serif; color:var(--ink);
    -webkit-user-select:none; user-select:none; touch-action:none; }
  #cv{ position:fixed; inset:0; width:100%; height:100%; display:block; cursor:grab; }
  #cv.dragging{ cursor:grabbing; }
  .hud{ position:fixed; z-index:5; pointer-events:none; }
  #head{ top:2.2vh; left:0; right:0; text-align:center; }
  #head .t{ font-size:clamp(17px,3.4vmin,30px); letter-spacing:.34em; color:var(--gold);
    text-shadow:0 0 18px rgba(212,175,55,.35); }
  #head .s{ font-size:clamp(10px,1.7vmin,14px); letter-spacing:.22em; color:#c9b893; margin-top:.6vh; font-style:italic; }
  #verse{ left:50%; bottom:9.5vh; transform:translateX(-50%); width:min(88vw,760px); text-align:center;
    transition:opacity 1.4s ease; opacity:0; }
  #verse .vt{ font-style:italic; font-size:clamp(12px,2vmin,17px); line-height:1.55; color:#f4ead5;
    text-shadow:0 2px 8px rgba(0,0,0,.8); }
  #verse .vr{ margin-top:.8vh; font-size:clamp(10px,1.5vmin,13px); letter-spacing:.24em; color:var(--gold); }
  #clock{ top:2.2vh; right:2.4vw; text-align:right; font-size:clamp(10px,1.6vmin,13px);
    letter-spacing:.14em; color:#c9b893; line-height:1.7; }
  #hint{ left:50%; bottom:2.2vh; transform:translateX(-50%); font-size:clamp(9px,1.45vmin,12px);
    letter-spacing:.18em; color:#8a7a5c; white-space:nowrap; }
  #ui{ position:fixed; z-index:6; right:2.2vw; bottom:6.5vh; display:flex; flex-direction:column; gap:1vh; }
  #back{ position:fixed; z-index:6; left:2.2vw; top:2.2vh; }
  .btn{ pointer-events:auto; background:rgba(30,23,17,.82); color:var(--ink);
    border:1px solid rgba(212,175,55,.45); border-radius:4px; padding:1.1vh 1.6vh;
    font-family:inherit; font-size:clamp(10px,1.6vmin,13px); letter-spacing:.14em;
    cursor:pointer; text-transform:uppercase; transition:all .18s; }
  .btn:hover{ background:rgba(212,175,55,.16); border-color:var(--gold); }
  .btn.off{ opacity:.5; }
  @media (max-width:700px){ #hint{ display:none; } #clock{ top:auto; bottom:2vh; right:2.4vw; } }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="hud" id="head">
  <div class="t">THE EARTH</div>
  <div class="s">the world within the firmament — the earth stands fast, and the lights run their courses</div>
</div>
<div class="hud" id="clock"></div>
<div class="hud" id="verse"><div class="vt" id="verse-t"></div><div class="vr" id="verse-r"></div></div>
<div class="hud" id="hint">the earth stands fast — drag to turn your view &nbsp;·&nbsp; scroll on any land to draw near to it &nbsp;·&nbsp; double-tap to return</div>
<button class="btn" id="back">⟵ The Besorah</button>
<div id="ui">
  <button class="btn" id="b-time">⏸ Hold the sun</button>
  <button class="btn" id="b-speed">⏩ Course: swift</button>
  <button class="btn" id="b-drag">🖐 Drag: turn the view</button>
  <button class="btn" id="b-names">🏷 Names: on</button>
  <button class="btn" id="b-sites">🏺 Sites: your journey</button>
  <button class="btn" id="b-moedim">✦ Appointed Times</button>
</div>

<script>
'use strict';
/* ==========================================================================
   THE EARTH — a scriptural-cosmology viewer.
   The earth is a still disc (Tehillim 104:5), the nations spread on its face
   with Yahrushalayim set in their midst (Yeḥezqal 5:5), the ice bounding the
   waters at the rim (Iyoḇ 26:10), and over it the firmament like a hard
   mirror (Iyoḇ 37:18) — a tent to dwell in (Yashayahu 40:22). The sun runs
   his circuit within it and hurries back (Tehillim 19 · Qoheleth 1:5), his
   course swinging between the tropics with the seasons, the moon behind him
   with her phases, and the stars over all. Everything runs by itself.
   ========================================================================== */
const cv=document.getElementById('cv'), g=cv.getContext('2d');
let W=0,H=0,DPR=1;

  cv.width=W*DPR; cv.height=H*DPR; }
window.addEventListener('resize',resize); resize();

const DATA=window.EARTH_DATA, COUNTRIES=DATA.countries, VERSES=DATA.verses;

const TEXN=2560, Tc=TEXN/2, Tr=TEXN/2;   // unit disc radius 1 -> Tr px
const TEX=document.createElement('canvas'); TEX.width=TEX.height=TEXN;
const ICE_R=0.952;                        // the ice wall begins here
function hash(x,y){ let h=Math.sin(x*127.1+y*311.7)*43758.5453; return h-Math.floor(h); }
function cellLatLon(u,v){ const r=Math.hypot(u,v); const lat=90-r*180;
  const lon=Math.atan2(u,v)*180/Math.PI; return [lat,lon]; }
function biome(lat,lon,n){
  if(lat>72 || (lat>60&&lon>-75&&lon<-12)) return ['#e6ebf2','#f4f7fb'];                       // the ice of the north
  if(lat>62) return n<.5?['#8a9a74','#9aa984']:['#7f9070','#8f9f80'];                          // tundra
  const desert=(lat>10&&lat<34&&lon>-17&&lon<62)||(lat>18&&lat<33&&lon>62&&lon<76)||
    (lat>-33&&lat<-17&&lon>112&&lon<147)||(lat>-29&&lat<-17&&lon>11&&lon<26)||
    (lat>-28&&lat<-16&&lon>-73&&lon<-65)||(lat>34&&lat<47&&lon>76&&lon<108);
  if(desert) return n<.5?['#cfb26a','#dcc17c']:['#c6a75e','#d4b671'];                          // the dry lands
  if(lat>-13&&lat<9) return n<.5?['#3f7a35','#4b8a40']:['#356c2e','#417c38'];                  // the rain forests
  return n<.34?['#6a9a4a','#78a857']:(n<.67?['#5f8f42','#6d9d4f']:['#74a352','#82b160']);      // the good green earth
}
function buildTexture(){
  // 1) paint the land mask from the real country polygons (azimuthal equidistant)
  const M=document.createElement('canvas'); M.width=M.height=TEXN;

  for(let j=0;j<N;j++)for(let i=0;i<N;i++){
    const x=i*CELL, y=j*CELL;
    const u=(x+CELL/2-Tc)/Tr, v=(y+CELL/2-Tc)/Tr;
    const r=Math.hypot(u,v);
    if(r>1.004) continue;                                   // beyond the rim: nothing
    const n=hash(i,j);
    let base,lit;
    if(r>ICE_R){ base=n<.5?'#dfe7ee':'#eef3f8'; lit='#ffffff'; }        // the wall of ice
    else if(land[j*N+i]){ const b=biome(...cellLatLon(u,v),n); base=b[0]; lit=b[1]; }
    else{
      const shelf=(land[j*N+i-1]||land[j*N+i+1]||land[(j-1)*N+i]||land[(j+1)*N+i]);
      base=shelf?'#4a7fae':(n<.5?'#2f5f92':'#356a9e'); lit=shelf?'#5f92bd':'#4478a8';
    }
    t.fillStyle=base; t.fillRect(x,y,CELL,CELL);
    t.fillStyle=lit;  t.fillRect(x,y,CELL,1.6);             // the lit top edge of the brick
    t.fillStyle='rgba(0,0,0,.16)'; t.fillRect(x+CELL-1.4,y,1.4,CELL);
    t.beginPath(); t.arc(x+CELL/2,y+CELL/2,CELL*.30,0,Math.PI*2);       // the stud
    t.fillStyle='rgba(255,255,255,.10)'; t.fill();
    t.beginPath(); t.arc(x+CELL/2,y+CELL/2+.8,CELL*.30,0,Math.PI*2);
    t.strokeStyle='rgba(0,0,0,.10)'; t.lineWidth=1; t.stroke();
  }
  // 3) the borders of the nations, drawn faint over the bricks
  t.strokeStyle='rgba(20,16,8,.32)'; t.lineWidth=2.2; t.lineJoin='round';
  for(const c of COUNTRIES) for(const ring of c.p){
    t.beginPath();
    for(let i=0;i<ring.length;i++){ const x=Tc+ring[i][0]*Tr, y=Tc+ring[i][1]*Tr;
      i?t.lineTo(x,y):t.moveTo(x,y); }
    t.closePath(); t.stroke();
  }
  // 4) the courses of the sun: the two tropics and the equator, drawn as rings
  for(const [rr,al] of [[.37,.16],[.5,.10],[.63,.16]]){
    t.beginPath(); t.arc(Tc,Tc,rr*Tr,0,Math.PI*2);
    t.strokeStyle=`rgba(212,175,55,${al})`; t.lineWidth=3; t.setLineDash([16,22]); t.stroke();
    t.setLineDash([]);
  }
  // 5) the rim of the deep, where the ice meets the sea
  t.beginPath(); t.arc(Tc,Tc,ICE_R*Tr,0,Math.PI*2);
  t.strokeStyle='rgba(220,235,245,.35)'; t.lineWidth=4.5; t.stroke();
}

/* ---------------- projection ---------------- */
let S=0,cx=0,cy=0,sinP=1,cosP=0,sinY=0,cosY=1;
function updateProj(){
  S=Math.min(W,H)*0.40*view.zoom; cx=W/2; cy=H/2+Math.min(W,H)*0.02;
  sinP=Math.sin(view.pitch); cosP=Math.cos(view.pitch);
  sinY=Math.sin(view.yaw);  cosY=Math.cos(view.yaw);
}
const P3=(u,v,y)=>{ const uu=u-view.pu, vv=v-view.pv;
  const x1=uu*cosY-vv*sinY, z1=uu*sinY+vv*cosY;
  return [cx+x1*S, cy+(z1*sinP-(y||0)*cosP)*S, z1]; };
/* the point of the earth's face under a screen point (its plane, y=0) */
function screenToDisc(mx,my){
  const x1=(mx-cx)/S, z1=(my-cy)/(S*Math.max(.05,sinP));
  return [view.pu + x1*cosY + z1*sinY, view.pv - x1*sinY + z1*cosY];
}
function discTransform(ctx,h){                       // the plane of the earth (or a layer h above it)
  const a=S*cosY/Tr, b=S*sinY*sinP/Tr, c=-S*sinY/Tr, d=S*cosY*sinP/Tr;
  const ox=(view.pu*cosY-view.pv*sinY)*S, oy=(view.pu*sinY+view.pv*cosY)*S*sinP;
  ctx.setTransform((a)*DPR,(b)*DPR,(c)*DPR,(d)*DPR,
    (cx-a*Tc-c*Tc-ox)*DPR,(cy-b*Tc-d*Tc-oy-(h||0)*S*cosP)*DPR);
}

/* ---------------- the luminaries ---------------- */
function sunState(){
  /* the year of Hanok: 364 days exactly, from the spring turning; the sun swings
     between his northern and southern courses through the portals (HANOK 72) */
  const D=dayOfYear;
  const R=0.5-0.13*Math.sin(2*Math.PI*(D-1)/364);
  const A=-(simHours/24)*2*Math.PI+Math.PI;                     // westward, ever returning (QOHELETH 1:5)
  return { u:R*Math.sin(A), v:R*Math.cos(A), y:0.36, R, A };
}
function moonState(){
  /* her age runs 0..29.53 days: with the sun when new, opposite him when full,
     and the two only meet again at the month's turning (an eclipse season) */
  const totalDays=dayOfYear+simHours/24;
  const age=(totalDays+32.55)%29.53;
  const sunA=-(simHours/24)*2*Math.PI+Math.PI;
  const A=sunA-2*Math.PI*age/29.53;
  const R=0.5-0.13*Math.sin(2*Math.PI*(dayOfYear-16)/364);
  return { u:R*Math.sin(A), v:R*Math.cos(A), y:0.31, R, A, age };
}

/* the reckoning of Hanok and Yobelim: months of 30/30/31, weekdays fixed forever */
function enochDate(d){
  const q=Math.floor((d-1)/91), dq=(d-1)%91;
  const mIn=dq<30?0:(dq<60?1:2);
  return { q, month:q*3+mIn+1, day:dq-(mIn===0?0:(mIn===1?30:60))+1, weekday:((d-1)+3)%7+1 };
}

/* ---------------- drawing ---------------- */
const DOME_R=1.05, DOME_H=0.56;
let ECX=0,ECY=0;                              // the earth's centre on screen (the dome never leaves it)
function domeSilhouette(ctx){
  const rx=DOME_R*S, apexY=ECY-DOME_H*S*cosP;
  ctx.moveTo(ECX-rx,ECY);
  ctx.bezierCurveTo(ECX-rx*.98,apexY+(ECY-apexY)*.30, ECX-rx*.52,apexY, ECX,apexY);
  ctx.bezierCurveTo(ECX+rx*.52,apexY, ECX+rx*.98,apexY+(ECY-apexY)*.30, ECX+rx,ECY);
}
function drawBody(b,isSun,t){
  const [px,py]=P3(b.u,b.v,b.y);
  const R=Math.min(S*(isSun?0.052:0.042), Math.min(W,H)*(isSun?0.065:0.052));
  if(px<-R*5||px>W+R*5||py<-R*5||py>H+R*5) return;
  if(isSun){
    const gl=g.createRadialGradient(px,py,R*.3,px,py,R*4.4);
    gl.addColorStop(0,'rgba(255,236,170,.85)'); gl.addColorStop(.35,'rgba(255,214,110,.30)');
    gl.addColorStop(1,'rgba(255,200,90,0)');
    g.fillStyle=gl; g.beginPath(); g.arc(px,py,R*4.4,0,Math.PI*2); g.fill();
    g.fillStyle='#fff3c4'; g.beginPath(); g.arc(px,py,R,0,Math.PI*2); g.fill();
    g.fillStyle='#ffe98f'; g.beginPath(); g.arc(px,py,R*.78,0,Math.PI*2); g.fill();
  } else {
    const gl=g.createRadialGradient(px,py,R*.3,px,py,R*2.6);
    gl.addColorStop(0,'rgba(220,228,240,.35)'); gl.addColorStop(1,'rgba(220,228,240,0)');
    g.fillStyle=gl; g.beginPath(); g.arc(px,py,R*2.6,0,Math.PI*2); g.fill();
    g.fillStyle='#d9dfe8'; g.beginPath(); g.arc(px,py,R,0,Math.PI*2); g.fill();
    g.fillStyle='rgba(140,150,168,.5)';
    for(const [ox,oy,cr] of [[-.32,-.18,.20],[.22,.10,.14],[-.02,.34,.11]]){
      g.beginPath(); g.arc(px+ox*R,py+oy*R,cr*R,0,Math.PI*2); g.fill(); }
    /* her phase follows her age: covered when she walks with the sun,
       clear-faced when she stands opposite him, the dark limb away from him */
    const sun=sunState();
    const [sx,sy]=P3(sun.u,sun.v,sun.y);
    let nx=px-sx, ny=py-sy; const nl=Math.hypot(nx,ny)||1; nx/=nl; ny/=nl;
    const c=Math.cos(2*Math.PI*(b.age||0)/29.53);          // 1 new … -1 full
    const d=(1-c)*1.02*R;
    if(d<2.0*R){
      g.fillStyle='rgba(8,12,26,.68)';
      g.beginPath(); g.arc(px+nx*d,py+ny*d,R*1.03,0,Math.PI*2); g.fill();
    }
  }
}
let lastT=0;

  const dt=Math.min(50,t-lastT||16); lastT=t;
  if(!view.paused){ simHours+=dt/1000*SPEEDS[view.speedIdx][0]/3600;
    if(simHours>=24){ simHours-=24; dayOfYear=dayOfYear%364+1; } }
  { const maxP=Math.min(.98, Math.max(0, 1.15*(1-1/Math.max(1,view.zoom))));
    const pl=Math.hypot(view.pu,view.pv);
    if(pl>maxP){ const k=maxP/(pl||1); view.pu*=k; view.pv*=k; } }
  updateProj();
  { const e9=P3(0,0,0); ECX=e9[0]; ECY=e9[1]; }
  g.setTransform(DPR,0,0,DPR,0,0);
  g.imageSmoothingEnabled=true; g.imageSmoothingQuality='high';

  g.fillStyle='#04060d'; g.fillRect(0,0,W,H);

  const wheelA=t*0.0000075;

    const a2=st.a+wheelA;
    g.fillStyle=`rgba(235,240,250,${al})`;
    g.fillRect(W/2+Math.cos(a2)*st.r*smax, H/2+Math.sin(a2)*st.r*smax, st.s, st.s);
  }

  /* the waters above the expanse, faintly */
  { const apexY=ECY-DOME_H*S*cosP;
    const wg=g.createRadialGradient(ECX,apexY,S*.1,ECX,apexY,S*1.5);
    wg.addColorStop(0,'rgba(60,110,180,.10)'); wg.addColorStop(1,'rgba(60,110,180,0)');
    g.fillStyle=wg; g.fillRect(0,0,W,H); }

  /* the back of the firmament */
  g.beginPath(); domeSilhouette(g);
  g.ellipse(ECX,ECY,DOME_R*S,Math.max(1,DOME_R*S*sinP),0,0,Math.PI,true);
  { const apexY=ECY-DOME_H*S*cosP, gl=.35+.65*cosP;
    const dg=g.createLinearGradient(0,apexY,0,cy);
    dg.addColorStop(0,`rgba(90,140,200,${.22*gl})`); dg.addColorStop(1,`rgba(60,100,160,${.06*gl})`);
    g.fillStyle=dg; g.fill(); }

  /* the four-cornered foundation, and the earth set upon it as a seal upon clay */
  drawFoundation(t);
  /* the bowl of the deep beneath, and the founded sides of the earth */
  const wallT=Math.max(1.5,S*0.05*cosP);
  { g.beginPath();
    g.moveTo(ECX-S,ECY+wallT*.4);
    g.quadraticCurveTo(ECX,ECY+wallT+S*0.40*cosP, ECX+S,ECY+wallT*.4);
    g.ellipse(ECX,ECY+wallT*.4,S,Math.max(1,S*sinP*.99),0,0,Math.PI);
    const bg=g.createRadialGradient(ECX,ECY+wallT,S*.2,ECX,ECY+wallT,S*1.1);
    bg.addColorStop(0,'#1c1712'); bg.addColorStop(1,'#050403');
    g.fillStyle=bg; g.fill(); }
  { /* the rim wall: ice above, the foundations below */
    g.beginPath();
    g.ellipse(ECX,ECY,S,Math.max(1,S*sinP),0,0,Math.PI);
    g.ellipse(ECX,ECY+wallT,S,Math.max(1,S*sinP),0,Math.PI,0,true);
    const wg=g.createLinearGradient(0,ECY,0,ECY+wallT+S*sinP);
    wg.addColorStop(0,'#e8eff5'); wg.addColorStop(.45,'#b8ccd8'); wg.addColorStop(1,'#5d5548');
    g.fillStyle=wg; g.fill(); }

  /* the face of the earth */
  const texScale=S/Tr;                          // >1 means the bricks are magnified
  discTransform(g,0);
  if(texScale<=4.5){
    g.imageSmoothingEnabled=texScale<1.15;      // hard brick edges when drawn near
    g.drawImage(TEX,0,0);
    g.imageSmoothingEnabled=true;
  } else {
    /* drawn very near, the map is redrawn true: the sea, the lands, the courses */
    g.beginPath(); g.arc(Tc,Tc,Tr*1.001,0,Math.PI*2);
    g.fillStyle='#33689c'; g.fill();
    g.beginPath(); g.arc(Tc,Tc,Tr,0,Math.PI*2);
    g.arc(Tc,Tc,ICE_R*Tr,0,Math.PI*2,true);
    g.fillStyle='#e6ebf2'; g.fill();
    for(const c of COUNTRIES){ g.fillStyle=c.col;
      for(const ring of c.p){ g.beginPath();
        for(let i=0;i<ring.length;i++){ const x=Tc+ring[i][0]*Tr, y=Tc+ring[i][1]*Tr;
          i?g.lineTo(x,y):g.moveTo(x,y); }
        g.closePath(); g.fill(); } }
    for(const [rr,al] of [[.37,.2],[.5,.13],[.63,.2]]){
      g.beginPath(); g.arc(Tc,Tc,rr*Tr,0,Math.PI*2);
      g.strokeStyle=`rgba(212,175,55,${al})`; g.lineWidth=2.4/texScale;
      g.setLineDash([16/texScale,22/texScale]); g.stroke(); g.setLineDash([]);
    }
  }
  /* when drawn near, the borders of the nations are re-drawn true, not stretched */
  if(texScale>1.1){
    g.strokeStyle='rgba(18,14,7,.5)'; g.lineWidth=1.7/texScale; g.lineJoin='round';
    for(const c of COUNTRIES) for(const ring of c.p){
      g.beginPath();
      for(let i=0;i<ring.length;i++){ const x=Tc+ring[i][0]*Tr, y=Tc+ring[i][1]*Tr;
        i?g.lineTo(x,y):g.moveTo(x,y); }
      g.closePath(); g.stroke();
    }
  }
  paintNight(sun);
  g.drawImage(NIGHT,0,0);
  { /* the warmth under the sun */
    const gr=Math.min(.20*Tr,(Math.min(W,H)*.40)/texScale);
    const sx=Tc+sun.u*Tr, sy=Tc+sun.v*Tr;
    const dg=g.createRadialGradient(sx,sy,0,sx,sy,gr);
    dg.addColorStop(0,'rgba(255,224,130,.20)'); dg.addColorStop(1,'rgba(255,224,130,0)');
    g.fillStyle=dg; g.beginPath(); g.arc(sx,sy,gr,0,Math.PI*2); g.fill(); }

  /* the clouds, a little above the face of it */
  discTransform(g,0.035);
  for(const c of CLOUDS){
    c.a+=c.drift*dt;
    const u=c.r*Math.sin(c.a), v=c.r*Math.cos(c.a);
    const x=Tc+u*Tr, y=Tc+v*Tr, r=c.s*Tr;
    const cg=g.createRadialGradient(x,y,0,x,y,r);
    cg.addColorStop(0,'rgba(255,255,255,.16)'); cg.addColorStop(.6,'rgba(255,255,255,.10)');
    cg.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=cg;
    g.beginPath(); g.ellipse(x,y,r*c.w*1.5,r,c.a,0,Math.PI*2); g.fill();
  }
  g.setTransform(DPR,0,0,DPR,0,0);

  /* the names upon the earth */
  if(view.names){
    const zl=view.zoom;
    g.textAlign='center'; g.textBaseline='middle';
    if(zl>1.35){
      const thr=zl>2.6?0:(zl>1.9?0.0009:0.003);
      const fs=Math.max(9,Math.min(21,S*0.016));
      g.font=`${fs}px Georgia,serif`;
      for(const c of COUNTRIES){
        if(c.a<thr) continue;
        const [px,py]=P3(c.c[0],c.c[1],0);
        if(px<-120||px>W+120||py<-60||py>H+60) continue;
        g.fillStyle='rgba(12,10,4,.55)'; g.fillText(c.n,px+1,py+1);
        g.fillStyle='rgba(244,238,220,.82)'; g.fillText(c.n,px,py);
      }
    }
    const fs2=Math.max(10,Math.min(23,S*0.019));
    g.font=`${fs2}px Georgia,serif`;
    const showAnc=view.zoom>1.55, placed=[];
    const clash=(x,y,w)=>placed.some(r=>Math.abs(x-r[0])<(w+r[2])/2+8&&Math.abs(y-r[1])<fs2*1.5);
    for(const a of ANCIENTS){
      if(!a.star&&!showAnc) continue;
      const [px,py]=P3(a.p[0],a.p[1],0);
      const lw=g.measureText(a.n).width;
      if(!a.star){ if(clash(px,py,lw)) continue; placed.push([px,py,lw]); }
      else placed.push([px,py-fs2*1.1,lw]);
      if(a.star){
        g.fillStyle='#fff3b8';
        g.save(); g.translate(px,py); g.rotate(t*.0004);
        g.beginPath();
        for(let k=0;k<8;k++){ const rr=k%2?fs2*.16:fs2*.42, an=k*Math.PI/4;
          g[k?'lineTo':'moveTo'](Math.cos(an)*rr,Math.sin(an)*rr); }
        g.closePath(); g.fill(); g.restore();
        g.fillStyle='rgba(12,10,4,.6)'; g.fillText(a.n,px+1,py-fs2*1.1+1);
        g.fillStyle='#fff3b8'; g.fillText(a.n,px,py-fs2*1.1);
        if(view.zoom>1.5){ g.font=`italic ${Math.max(8,fs2*.55)}px Georgia,serif`;
          g.fillStyle='rgba(212,175,55,.75)'; g.fillText(a.sub,px,py+fs2*.9);
          g.font=`${fs2}px Georgia,serif`; }
      } else {
        g.fillStyle='rgba(12,10,4,.6)'; g.fillText(a.n,px+1,py+1);
        g.fillStyle='rgba(212,175,55,.9)'; g.fillText(a.n,px,py);
      }
    }
  }

  /* the ancient sites of the land, when you draw near */
  if(view.zoom>3.4&&siteMode<2){
    const placedS=[];
    const fs3=Math.max(10,Math.min(19,S*0.0135));
    const noteOn=view.zoom>=10;
    const boxH=noteOn?fs3*5.2:fs3*2.8;
    const clashS=(x,y,w)=>placedS.some(r=>Math.abs(x-r[0])<(w+r[2])/2+8&&Math.abs(y-r[1])<boxH);
    g.textAlign='center'; g.textBaseline='middle';
    for(const st of SITES){
      if(st.geo||!siteShown(st)) continue;
      const [px,py]=P3(st.p[0],st.p[1],0);
      if(px<-80||px>W+80||py<-80||py>H+80) continue;
      g.font=`${fs3}px Georgia,serif`;
      const lw=Math.max(g.measureText(st.n).width, noteOn&&st.note?g.measureText(st.note).width*.78:0);
      if(clashS(px,py,lw)) continue;
      placedS.push([px,py,lw]);
      /* the marker: a small gold-ringed point on the land */
      g.beginPath(); g.arc(px,py,Math.max(2.4,fs3*.22),0,Math.PI*2);
      g.fillStyle='#ffe9a8'; g.fill();
      g.beginPath(); g.arc(px,py,Math.max(4,fs3*.42),0,Math.PI*2);
      g.strokeStyle='rgba(212,175,55,.8)'; g.lineWidth=1.3; g.stroke();
      g.fillStyle='rgba(12,10,4,.65)'; g.fillText(st.n,px+1,py-fs3*1.2+1);
      g.fillStyle='#f4dfa8'; g.fillText(st.n,px,py-fs3*1.2);
      if(noteOn&&st.note){
        g.font=`italic ${fs3*.76}px Georgia,serif`;
        g.fillStyle='rgba(10,8,4,.6)'; g.fillText(st.note,px+1,py+fs3*1.05+1);
        g.fillStyle='rgba(232,222,196,.95)'; g.fillText(st.note,px,py+fs3*1.05);
        g.fillStyle='rgba(212,175,55,.85)';
        g.font=`${fs3*.64}px Georgia,serif`;
        g.fillText('— '+st.ref+' —',px,py+fs3*2.05);
        g.font=`${fs3}px Georgia,serif`;
      }
    }
    /* the waters and regions, drawn where room remains */
    if(view.zoom>4.5) for(const st of SITES){
      if(!st.geo) continue;
      const [px,py]=P3(st.p[0],st.p[1],0);
      if(px<-80||px>W+80||py<-80||py>H+80) continue;
      g.font=`italic ${fs3*1.02}px Georgia,serif`;
      const lw=g.measureText(st.n).width;
      if(clashS(px,py,lw)) continue;
      placedS.push([px,py,lw]);
      g.fillStyle='rgba(190,215,235,.6)';
      g.fillText(st.n,px,py);
    }
  }

  /* the lights in the expanse of the shamayim */
  drawBody(moon,false,t);
  drawBody(sun,true,t);

  /* the glass of the firmament, before all */
  g.beginPath(); domeSilhouette(g);
  g.ellipse(ECX,ECY,DOME_R*S,Math.max(1,DOME_R*S*sinP),0,Math.PI,0,true);
  { const apexY=ECY-DOME_H*S*cosP, gl=.3+.7*cosP;
    const fg=g.createLinearGradient(0,apexY,0,cy+DOME_R*S*sinP);
    fg.addColorStop(0,`rgba(150,195,235,${.13*gl})`); fg.addColorStop(.6,`rgba(120,170,215,${.06*gl})`);
    fg.addColorStop(1,`rgba(120,170,215,${.02*gl})`);
    g.fillStyle=fg; g.fill(); }
  { /* its sheen, like a hard mirror (IYOḆ 37:18) */
    const apexY=ECY-DOME_H*S*cosP;
    g.beginPath();
    g.moveTo(ECX-DOME_R*S*.78,ECY-(ECY-apexY)*.32);
    g.quadraticCurveTo(ECX-DOME_R*S*.30,apexY-(ECY-apexY)*.06, ECX+DOME_R*S*.14,apexY+(ECY-apexY)*.10);
    g.strokeStyle=`rgba(235,245,255,${.17*cosP})`; g.lineWidth=Math.max(2,S*.016); g.lineCap='round'; g.stroke(); }
  g.beginPath(); g.ellipse(ECX,ECY,DOME_R*S,Math.max(1,DOME_R*S*sinP),0,0,Math.PI*2);
  g.strokeStyle='rgba(210,230,245,.30)'; g.lineWidth=Math.max(1.5,S*.008); g.stroke();

  /* the world's clock */
  const hh=Math.floor(simHours), mm=Math.floor((simHours%1)*60);
  const D=Math.floor(dayOfYear), ed=enochDate(D);
  const north=sun.R<0.5;
  const age=moon.age, moonWord=age<1.5?'new — she walks with the sun':(Math.abs(age-14.77)<1.5?'full — she stands opposite him':(age<14.77?'waxing':'waning'));
  let feast='', next=null, nd=999;
  for(const f of FEASTS){ const s0=dayFor(f.m,f.d);
    if(D>=s0&&D<s0+f.len){ feast=`✦ ${f.n}${f.len>1?' — day '+(D-s0+1)+' of '+f.len:''} ✦`; }
    let dd=s0-D; if(dd<0) dd+=364; if(dd>0&&dd<nd){ nd=dd; next=f; } }
  if(!feast&&ed.weekday===7) feast='✦ the SHABBATH ✦';
  document.getElementById('clock').innerHTML=
    `month ${ed.month}, day ${ed.day} · the ${WD[ed.weekday]} · ${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}<br>`+
    `the sun runs the ${north?'northern':'southern'} course${Math.abs(sun.R-0.37)<0.004?' — the summer turning':(Math.abs(sun.R-0.63)<0.004?' — the winter turning':'')}<br>`+
    `the moon is ${age.toFixed(1)} days old · ${moonWord}<br>`+
    (feast?`<span style="color:#fff3b8;letter-spacing:.14em">${feast}</span>`:
     `next appointed time: ${next.n} — in ${nd} day${nd===1?'':'s'}`);

  requestAnimationFrame(frame);
}

/* ---------------- the four-cornered foundation ----------------
   The earth is set on a great square, as it is written of its four corners
   and its columns — and beneath the corners, the pillars go down out of sight. */
const SLAB_VERSES=[
  {t:'“It is changed like clay under a seal…” — to take hold of the ends of the earth', r:'IYOḆ 38:14 · 13'},
  {t:'“I saw four mal’akim standing at the four corners of the earth, holding the four ruchot of the earth”', r:'ḤAZON 7:1'},
  {t:'“…and gather the outcasts of Yasharal from the four corners of the earth”', r:'YASHAYAHU 11:12'},
  {t:'“The earth and all its inhabitants are melted; it is I who set its columns firm.”', r:'TEHILLIM 75:3'},
];
function drawFoundation(t){
  if(view.zoom>8) return;                       // drawn near, the foundation lies beyond sight
  const SQ=1.36, yT=-0.055, yB=-0.62;
  const C4=[[-SQ,-SQ],[SQ,-SQ],[SQ,SQ],[-SQ,SQ]];
  const top=C4.map(c=>P3(c[0],c[1],yT));
  const bot=C4.map(c=>P3(c[0],c[1],yB));
  /* the pillars first: four great beams set under the corners, sunk into the
     darkness beneath (IYOḆ 9:6, TEHILLIM 75:3). Each is a true square column in
     world space, its head buried in the underside of the slab so it carries it. */
  {
    const HW=0.235, CIN=0.34, PH=2.3;          // half-width, corner inset, depth of the beam
    const yTop=yB+0.16, yBot=yB-PH;            // head sunk up into the slab; foot lost below
    const order=[[-1,-1],[1,-1],[1,1],[-1,1]]
      .map(sg=>({sg, z:(sg[0]*(SQ-CIN))*sinY+(sg[1]*(SQ-CIN))*cosY}))
      .sort((a,b)=>a.z-b.z);                   // far beams first, near beams over them
    for(const {sg} of order){
      const cu=sg[0]*(SQ-CIN), cv=sg[1]*(SQ-CIN);
      const cc=[[cu-HW,cv-HW],[cu+HW,cv-HW],[cu+HW,cv+HW],[cu-HW,cv+HW]];
      for(let f=0;f<4;f++){
        const a=cc[f], b=cc[(f+1)%4];
        const nu=b[1]-a[1], nv=-(b[0]-a[0]);   // outward normal of this face
        if(nu*sinY+nv*cosY<=0) continue;       // it faces away from the beholder
        const Ta=P3(a[0],a[1],yTop), Tb=P3(b[0],b[1],yTop);
        const Ba=P3(a[0],a[1],yBot), Bb=P3(b[0],b[1],yBot);
        const nl=Math.hypot(nu,nv)||1;
        const sh=.42+.58*Math.max(0,(nu/nl)*-.5+(nv/nl)*-.87);
        const R=Math.round(112*sh), G9=Math.round(96*sh), B9=Math.round(70*sh);
        const gr=g.createLinearGradient(0,(Ta[1]+Tb[1])/2,0,(Ba[1]+Bb[1])/2);
        gr.addColorStop(0,`rgba(${R},${G9},${B9},.95)`);
        gr.addColorStop(.5,`rgba(${Math.round(R*.55)},${Math.round(G9*.55)},${Math.round(B9*.55)},.6)`);
        gr.addColorStop(1,'rgba(14,11,8,0)');
        g.fillStyle=gr;
        g.beginPath(); g.moveTo(Ta[0],Ta[1]); g.lineTo(Tb[0],Tb[1]);
        g.lineTo(Bb[0],Bb[1]); g.lineTo(Ba[0],Ba[1]); g.closePath(); g.fill();
        /* a faint worked edge down the near arris of the beam */
        const eg=g.createLinearGradient(0,Tb[1],0,Bb[1]);
        eg.addColorStop(0,'rgba(214,186,128,.35)'); eg.addColorStop(.55,'rgba(214,186,128,.12)');
        eg.addColorStop(1,'rgba(214,186,128,0)');
        g.strokeStyle=eg; g.lineWidth=Math.max(1,S*.004);
        g.beginPath(); g.moveTo(Tb[0],Tb[1]); g.lineTo(Bb[0],Bb[1]); g.stroke();
      }
    }
  }
  /* the sides of the square that face the beholder */
  for(let i=0;i<4;i++){
    const a=top[i], b=top[(i+1)%4], a2=bot[i], b2=bot[(i+1)%4];
    if((a[1]+b[1])/2<=ECY) continue;
    const gr=g.createLinearGradient(0,(a[1]+b[1])/2,0,(a2[1]+b2[1])/2);
    gr.addColorStop(0,'#3a3226'); gr.addColorStop(1,'#171310');
    g.fillStyle=gr;
    g.beginPath(); g.moveTo(a[0],a[1]); g.lineTo(b[0],b[1]);
    g.lineTo(b2[0],b2[1]); g.lineTo(a2[0],a2[1]); g.closePath(); g.fill();
  }
  /* its face, the seal-ground the earth is pressed upon */
  { g.beginPath();
    g.moveTo(top[0][0],top[0][1]);
    for(let i=1;i<4;i++) g.lineTo(top[i][0],top[i][1]);
    g.closePath();
    const gr=g.createRadialGradient(ECX,ECY,S*.2,ECX,ECY,S*2.0);
    gr.addColorStop(0,'#57493466'); gr.addColorStop(.55,'#4a3e2c');
    gr.addColorStop(1,'#241d15');
    g.fillStyle='#4a3e2c'; g.fill();
    g.fillStyle=gr; g.fill();
    g.strokeStyle='rgba(212,175,55,.28)'; g.lineWidth=Math.max(1,S*.006); g.stroke(); }
  /* the words upon its four edges */
  if(sinP>.22){
    const fs=Math.max(8,Math.min(19,S*.028));
    g.textAlign='center'; g.textBaseline='middle';
    for(let i=0;i<4;i++){
      const c1=C4[i], c2=C4[(i+1)%4];
      const mu=(c1[0]+c2[0])/2*.86, mv=(c1[1]+c2[1])/2*.86;
      const [mx,my]=P3(mu,mv,yT);
      if(mx<-W*.4||mx>W*1.4||my<-H*.4||my>H*1.4) continue;
      const [e1x,e1y]=P3(c1[0]*.86,c1[1]*.86,yT), [e2x,e2y]=P3(c2[0]*.86,c2[1]*.86,yT);
      let ang=Math.atan2(e2y-e1y,e2x-e1x);
      if(ang>Math.PI/2||ang<-Math.PI/2) ang+=Math.PI;
      const v9=SLAB_VERSES[i];
      const al=Math.min(1,(sinP-.22)*2.2)*.9;
      g.save(); g.translate(mx,my); g.rotate(ang);
      g.font=`italic ${fs}px Georgia,serif`;
      g.fillStyle=`rgba(16,12,6,${al*.7})`; g.fillText(v9.t,1,1);
      g.fillStyle=`rgba(214,192,146,${al})`; g.fillText(v9.t,0,0);
      g.font=`${fs*.72}px Georgia,serif`;
      g.fillStyle=`rgba(212,175,55,${al*.85})`;
      g.fillText('— '+v9.r+' —',0,fs*1.35);
      g.restore();
    }
  }
}

/* ---------------- input: turn the heavens, draw near ---------------- */
const drag={on:false,x:0,y:0,id:null,p2:null,d0:0,z0:1};
cv.addEventListener('pointerdown',e=>{
  if(drag.on&&drag.id!==null&&e.pointerId!==drag.id){ drag.p2={id:e.pointerId,x:e.clientX,y:e.clientY};
    drag.d0=Math.hypot(e.clientX-drag.x,e.clientY-drag.y); drag.z0=view.zoom; return; }
  drag.on=true; drag.id=e.pointerId; drag.x=e.clientX; drag.y=e.clientY;
  cv.classList.add('dragging'); cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove',e=>{
  if(!drag.on) return;
  if(drag.p2&&(e.pointerId===drag.id||e.pointerId===drag.p2.id)){
    if(e.pointerId===drag.id){ drag.x=e.clientX; drag.y=e.clientY; }
    else{ drag.p2.x=e.clientX; drag.p2.y=e.clientY; }
    const d=Math.hypot(drag.p2.x-drag.x,drag.p2.y-drag.y);
    if(drag.d0>0){
      const mx=(drag.x+drag.p2.x)/2, my=(drag.y+drag.p2.y)/2;
      const [au,av]=screenToDisc(mx,my);
      const z0=view.zoom;
      view.zoom=Math.max(.55,Math.min(240,drag.z0*d/drag.d0));
      const k=1-z0/view.zoom;
      view.pu+=(au-view.pu)*k; view.pv+=(av-view.pv)*k;
    }
    return;
  }
  if(e.pointerId!==drag.id) return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  drag.x=e.clientX; drag.y=e.clientY;
  if(view.dragMove){
    const du=(dx/S)*cosY+(dy/(S*Math.max(.05,sinP)))*sinY;
    const dv=-(dx/S)*sinY+(dy/(S*Math.max(.05,sinP)))*cosY;
    view.pu-=du; view.pv-=dv;
  } else {
    view.yaw+=dx*0.0052;
    view.pitch=Math.max(0.14,Math.min(1.48,view.pitch+dy*0.0042));
  }
});
const endP=e=>{ if(drag.p2&&e.pointerId===drag.p2.id){ drag.p2=null; return; }
  if(e.pointerId===drag.id){ drag.on=false; drag.id=null; drag.p2=null; cv.classList.remove('dragging'); } };
cv.addEventListener('pointerup',endP); cv.addEventListener('pointercancel',endP);
cv.addEventListener('wheel',e=>{ e.preventDefault();
  const [au,av]=screenToDisc(e.clientX,e.clientY);           // hold this land under the cursor
  const z0=view.zoom;
  view.zoom=Math.max(.55,Math.min(240,view.zoom*Math.exp(-e.deltaY*0.0011)));
  const k=1-z0/view.zoom;
  view.pu+=(au-view.pu)*k; view.pv+=(av-view.pv)*k;
},{passive:false});
cv.addEventListener('dblclick',()=>{ view.yaw=0.65; view.pitch=0.52; view.zoom=1.05; view.pu=0; view.pv=0; });

  $('b-time').classList.toggle('off',view.paused); };
$('b-speed').onclick=()=>{ view.speedIdx=(view.speedIdx+1)%SPEEDS.length;
  $('b-speed').textContent='⏩ Course: '+SPEEDS[view.speedIdx][1]; };
$('b-drag').onclick=()=>{ view.dragMove=!view.dragMove;
  $('b-drag').textContent=view.dragMove?'🖐 Drag: move the map':'🖐 Drag: turn the view'; };
$('b-names').onclick=()=>{ view.names=!view.names;
  $('b-names').textContent='🏷 Names: '+(view.names?'on':'off');
  $('b-names').classList.toggle('off',!view.names); };
$('b-sites').onclick=()=>{ siteMode=(siteMode+1)%3;
  $('b-sites').textContent='🏺 Sites: '+['your journey','all','off'][siteMode];
  $('b-sites').classList.toggle('off',siteMode===2); };
$('b-moedim').onclick=()=>{ location.href='appointed-times.html'; };

requestAnimationFrame(frame);
</script>
<script src="../assets/besorah-fullscreen.js" defer></script>
</body>
